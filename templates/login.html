<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCM Sickbay Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="center"><main class="card login"><h1>VCM SICKBAY SYSTEM</h1><p>Offline-first sickbay management</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form><small>Initialize with <code>flask --app app initialize</code>, then change the default passwords.</small></main></body></html>
